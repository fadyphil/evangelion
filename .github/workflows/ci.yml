# CI — gates 1-7 of tool/verify_all.sh, on every push and every pull request.
#
# Badge: https://github.com/fadyphil/evangelion/actions/workflows/ci.yml/badge.svg
#
# This runs the SAME script a contributor runs locally. It does not re-implement
# a single gate in YAML, because a gate implemented twice is a gate that can
# disagree with itself, and the only question a reader has about CI is whether
# it is the thing CONTRIBUTING.md tells them to run.
#
# ## THE EXIT-CODE CONTRACT IS LOAD-BEARING. DO NOT "SIMPLIFY" IT.
#
# tool/verify_all.sh exits:
#
#     0   every gate that ran was clean
#     1   at least one gate FAILED — it ran and found something
#     2   a gate could NOT RUN — missing tool, broken rg, unreadable baseline
#
# 2 is not a flavour of 0. A gate that could not run checked nothing, and it is
# indistinguishable from a pass to anything reading the exit code alone. That is
# the defect ADR-0020 records: gates reporting clean over a surface they never
# examined, three false greens in a row, and then an unreachable assertion once
# fixed. docs/adr/0020-a-gate-that-cannot-fail-is-worse-than-no-gate.md
#
# So the run step below always lets the job continue, and the last step
# re-raises 1 and 2 as separate, differently-worded failures. Do not replace
# this with a bare `run: tool/verify_all.sh`. That is not a shorter equivalent;
# it deletes the only place the difference between "found a problem" and
# "checked nothing" is still visible.

name: CI

on:
  push:
    branches:
      # main is the only supported line. The three prefixes are every branch the
      # project actually uses (feat/phase-N-*, build/*, docs/*); check with
      # `git branch -a` before adding another.
      - main
      - 'feat/**'
      - 'build/**'
      - 'docs/**'
  pull_request:

# Least privilege. This workflow reads the repository and writes nothing back.
permissions:
  contents: read

# Superseded pull request runs are cancelled; pushes are not, so a main-branch
# run is never abandoned half-finished. github.ref is refs/pull/N/merge on a
# pull request, so each PR gets its own group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: Gates 1-7
    runs-on: ubuntu-latest

    # `runner` is a STEP-level context only. This line was `${{ runner.tool_cache
    # }}` and GitHub rejected the entire workflow at validation with
    #   Unrecognized named-value: 'runner'. Located at position 1
    # before a single job was created — 0s run, no log, no check runs.
    #
    # The comment that stood here previously claimed moving this from a top-level
    # `env` to a job-level `env` was the fix. It is not: neither exposes `runner`,
    # and moving it is what made the wrong claim survive a second reading. The
    # valid job-level contexts are `github`, `needs`, `strategy`, `matrix`,
    # `vars`, `secrets` and `inputs`; `runner` joins them only at step level.
    #
    # Declared once here and read back by the two steps below through `env`, so
    # flutter-action's cache and this cache cannot drift onto different paths.
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    # Gates 6 and 7 each run the whole suite, and Flutter's first run on a cold
    # runner is slow. This is generous; it exists to catch a hang, not to fail.
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The architecture gates are ripgrep patterns. Without rg every scan
      # returns empty and the gate passes vacuously, which is exactly the shape
      # of false green ADR-0020 describes. ubuntu-latest ships rg, but it is
      # installed explicitly so this does not depend on the runner image, and
      # so a change to the base image is visible in this file rather than
      # inferred from a green run.
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      # Two of the gates under tool/gates/ are Python. verify_all.sh reports
      # FATAL, not FAIL, if python3 is absent — which is the right answer, and
      # one this workflow surfaces rather than swallows.
      - name: Check Python 3
        run: python3 --version

      # 3.47.4 exactly, and that is not a default. The analyzer's behaviour and
      # the golden PNGs are both version-sensitive, so "close enough" here is a
      # moving baseline that nobody agreed to. The project pins Flutter 3.47.4 /
      # Dart 3.13.3 and records it in tool/baseline/gates.txt.
      #
      # cache: true caches the Flutter SDK download. The pub cache is a separate
      # path and is cached by the next step.
      - name: Set up Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          cache-key: flutter-3.47.4-linux
          pub-cache-path: ${{ env.PUB_CACHE }}

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Report the toolchain
        run: |
          flutter --version
          dart --version

      # verify_all.sh does not resolve dependencies itself. The generated
      # freezed / auto_route / injectable outputs are committed, so no
      # build_runner step is needed — and running one would be a gate input
      # quietly mutating under the run.
      - name: Resolve packages
        run: flutter pub get

      # --with-build is deliberately NOT passed, and the omission is a decision
      # rather than an oversight.
      #
      # Gate 8, tool/verify_linux_build.sh, needs a GUI Linux desktop toolchain
      # (GTK 3 development headers, clang, cmake, ninja, pkg-config), takes
      # minutes, and WIPES build/linux/x64/{debug,release} before rebuilding. It
      # is the slowest gate and the only one that mutates the tree instead of
      # reading it, so it belongs on the contributor's machine, not in a hosted
      # runner. CONTRIBUTING.md asks for `tool/verify_all.sh --with-build`
      # locally before opening a pull request; this workflow checks the other
      # seven, and a missing gate 8 here does not mean a passing one.
      #
      # PIPESTATUS[0] is the script's own exit code. Without it the tee would be
      # the thing measured, and tee always succeeds.
      - name: Run gates 1-7
        id: gates
        run: |
          set +e
          tool/verify_all.sh 2>&1 | tee "$RUNNER_TEMP/gates.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Evidence for a red run. lcov.info is what gate 7 compares against the
      # recorded floor in tool/baseline/gates.txt, so a coverage failure cannot
      # be diagnosed without it. The gate log carries the per-gate detail that
      # the step summary trims.
      - name: Upload failure evidence
        if: ${{ always() && steps.gates.outputs.exit_code != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-failure-evidence
          path: |
            coverage/lcov.info
            ${{ runner.temp }}/gates.log
          if-no-files-found: warn
          retention-days: 14

      # Re-raises whatever the run step recorded. `always()` so a FATAL still
      # gets its explanation printed before the job turns red — the difference
      # between "found a violation" and "checked nothing" has to survive into
      # the logs, because the exit code alone is 1 in both cases from here.
      - name: Surface the gate summary
        if: ${{ always() }}
        env:
          EXIT_CODE: ${{ steps.gates.outputs.exit_code }}
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/gates.log"
          code="${EXIT_CODE:-}"

          {
            echo '## Gates'
            echo
            if [[ -f "$log" ]]; then
              sed -n '/^Summary/,$p' "$log"
            else
              echo 'The gate log was missing; the run step did not reach it.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$code" ]]; then
            echo '::error::No exit code was recorded, so nothing was verified. Treat this run as unknown, not as clean.'
            exit 1
          fi

          case "$code" in
            0)
              echo 'Every gate that ran was clean.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo '::error::At least one gate FAILED — it ran and found something. See the summary above.'
              exit 1
              ;;
            2)
              echo '::error::A gate COULD NOT RUN, so it checked nothing. This is not a pass. See the summary above.'
              exit 1
              ;;
            *)
              echo "::error::tool/verify_all.sh exited $code, which is not a code it documents. Treat this run as unknown."
              exit 1
              ;;
          esac