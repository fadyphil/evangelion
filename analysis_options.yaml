# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - linux/**

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # --- AGENT_CONTEXT §4: no dynamic anywhere -----------------------------
    - avoid_dynamic_calls
    - avoid_returning_null_for_void

    # --- AGENT_CONTEXT §4: explicit types on every public API --------------
    - always_declare_return_types
    # NOTE: `omit_local_variable_types` is deliberately NOT enabled — this
    # project keeps explicit local types too.

    # --- AGENT_CONTEXT §4: final by default --------------------------------
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_function_literals_in_foreach_calls

    # --- AGENT_CONTEXT §4: no bare dropped futures -------------------------
    - unawaited_futures
    - await_only_futures

    # --- AGENT_CONTEXT §4: debugPrint, never print -------------------------
    - avoid_print

    # --- AGENT_CONTEXT §4: error handling discipline ------------------------
    - only_throw_errors
    - throw_in_finally
    - avoid_catches_without_on_clauses
    - avoid_catching_errors

    # --- SOLID: resource lifetimes (LSP — no leaks across the seam) ---------
    - cancel_subscriptions
    - close_sinks

    # --- AGENT_CONTEXT §4: idiomatic API shape -----------------------------
    - use_super_parameters
    - avoid_positional_boolean_parameters
    - unnecessary_lambdas
    - unnecessary_this
    - avoid_void_async
    - no_leading_underscores_for_local_identifiers
    - test_types_in_equals
    - avoid_empty_else
    - avoid_slow_async_io

    # --- Effective Dart: performance ----------------------------------------
    - sized_box_for_whitespace
    - sized_box_shrink_expand

    # --- Effective Dart: formatting ----------------------------------------
    - prefer_single_quotes
    - require_trailing_commas

    # --- Effective Dart: const ----------------------------------------------
    # AGENT_CONTEXT §4 mandates `const` wherever the compiler allows, but nothing
    # enforced it. These two make the requirement objective.
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables

    # --- Import hygiene -----------------------------------------------------
    # `dart format` does NOT sort imports, so an unsorted directive list never
    # self-corrects; the analyzer is the only thing that will catch it.
    - directives_ordering

    # --- Bilingual (ar / en) safety -----------------------------------------
    # A bilingual string table is a list of literals. Without this lint, a
    # half-translated set (English left in the Arabic arm, or a value dropped
    # from one language) compiles and ships silently.
    - no_adjacent_strings_in_list
