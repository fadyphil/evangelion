name: evangelion
description: "Evangelion — bilingual (Arabic / English) Sunday-School daily reading client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Bilingual (ar / en) localization for the reading sanctuary.
  # `intl` is a hard requirement of flutter_localizations, which pins it to
  # 0.20.x; `^0.20.3` matches that pin exactly. This was the only unconstrained
  # dependency, so it floated to whatever was newest on any given pub get.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Transport, state, DI and routing.
  dio: ^5.11.1
  flutter_bloc: ^9.1.1
  # Immutable states, events and entities. See AGENT_CONTEXT §2.1 decision 8a.
  freezed_annotation: ^3.1.0
  # `equatable` is NOT a direct dependency any more. `Failure` and `Result<T>` are
  # the last two types that needed an equality library, and both now hand-write
  # their own `==`/`hashCode` (`core/common/`). It still arrives transitively via
  # `flutter_bloc`; see AGENT_CONTEXT §2.1 decision 8a.
  #
  # `Failure` keeps [kind, message, statusCode] and excludes [details] deliberately,
  # and `Result<T>` compares per arm — both contracts are pinned by
  # `test/core/common/{failure_equality,result}_test.dart`, including the
  # covariance case (`Success<int>(1)` vs `Success<num>(1)`) that makes
  # `runtimeType` load-bearing rather than redundant.
  get_it: ^9.3.0
  injectable: ^3.0.0
  auto_route: ^11.2.0

  # Local-only settings persistence (no server sync).
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code generation: auto_route (.gr.dart), injectable (.config.dart) and
  # freezed (.freezed.dart).
  build_runner: ^2.16.1
  auto_route_generator: ^10.6.0
  injectable_generator: ^3.0.0
  freezed: ^4.0.1

  # Test doubles and bloc behaviour assertions.
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  # ARB + `gen_l10n`. AGENT_CONTEXT §2.1 decision 8b: the hand-rolled `*Strings`
  # tables are replaced by `lib/l10n/*.arb`. This is the ONLY pubspec change and
  # it adds no dependency — `flutter_localizations` and `intl` were already here.
  generate: true
  uses-material-design: true

  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-RegularItalic.ttf
          weight: 400
          style: italic

    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-RegularItalic.ttf
          weight: 400
          style: italic

    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800

    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          weight: 400
          style: italic

    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
