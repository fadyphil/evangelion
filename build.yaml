# build_runner configuration.
#
# `injectable_generator` would otherwise run over every Dart file in the
# package, including `test/`. Restricting it to `lib/**` keeps DI registration
# generation scoped to production sources.
#
# NOTE ON BUILDER KEYS: injectable_generator declares TWO builders in its own
# build.yaml — `injectable_builder` (emits `.injectable.json` to the build
# cache) and `injectable_config_builder` (emits `.config.dart` to source).
# Both are listed here. build_runner silently IGNORES options for an unknown
# builder key (it only prints a warning), so a stale key such as the 1.x-era
# `injectable_generator:injective_generator` would leave this file inert.
#
# `freezed` declares ONE builder, keyed `freezed` (not `freezed_generator:…`),
# and its own scope is every Dart file — `generate_for` below narrows it to
# `lib/**` so a test fixture cannot grow a stray generated part. The same
# "unknown key is ignored, not rejected" rule applies to the spelling, which is
# why it is written out rather than left to a default.
targets:
  $default:
    builders:
      injectable_generator:injectable_builder:
        generate_for:
          - lib/**/*.dart
      injectable_generator:injectable_config_builder:
        generate_for:
          - lib/**/*.dart
      freezed:freezed:
        generate_for:
          - lib/**/*.dart

# `auto_route_generator` keeps its default scope: it only emits for files
# annotated with `@RoutePage` / `@AutoRouterConfig`, so no entry is needed here.
